name: Seite auf GitHub Pages veroeffentlichen

# Laeuft automatisch bei jedem Push auf main und kann jederzeit von Hand
# gestartet werden. Solange GitHub Pages fuer dieses private Repository nicht
# freigeschaltet ist, bricht der Schritt "Pages einrichten" ab - sobald Pages
# verfuegbar ist (GitHub Pro oder oeffentliches Repository), veroeffentlicht
# der Workflow die index.html ohne weitere Aenderung.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Seite als Artefakt packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
