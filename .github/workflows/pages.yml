name: Seite auf GitHub Pages veroeffentlichen

# Laeuft automatisch bei jedem Push auf main und kann jederzeit von Hand
# gestartet werden.
#
# Voraussetzung, einmalig von Hand: unter Settings -> Pages muss als Quelle
# "GitHub Actions" eingestellt sein. Das Einschalten selbst kann kein Workflow
# uebernehmen - POST /repos/{owner}/{repo}/pages verlangt laut GitHub-Doku
# "Pages: write" UND "Administration: write", und das GITHUB_TOKEN eines
# Workflows erhaelt "Administration: write" nie.

# Nur manuell: solange Pages nicht eingeschaltet ist, wuerde jeder Push sonst
# einen roten Lauf erzeugen. Nach dem Einschalten hier wieder "push" ergaenzen.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages einrichten
        uses: actions/configure-pages@v5

      - name: Seite als Artefakt packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
