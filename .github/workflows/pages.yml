name: Seite auf GitHub Pages veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages aktivieren und Ergebnis festhalten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "GET /pages"
            curl -s -o /tmp/get.json -w 'HTTP %{http_code}\n' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages"
            head -c 800 /tmp/get.json; echo

            echo "POST /pages build_type=workflow"
            curl -s -o /tmp/post.json -w 'HTTP %{http_code}\n' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"build_type":"workflow"}'
            head -c 800 /tmp/post.json; echo
          } > pages-diagnose.txt 2>&1
          cat pages-diagnose.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-diagnose.txt
          git commit -m "Pages-Diagnose aus dem Workflow" || true
          git push || true

      - name: Pages einrichten
        uses: actions/configure-pages@v5

      - name: Seite als Artefakt packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
